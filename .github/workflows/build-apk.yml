name: Build Flix Universal Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLIX_PACKAGE: com.halluyapp.flix

jobs:
  build:
    name: Analyze, test, and build universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analyzer
        id: analyze
        run: |
          set +e
          mkdir -p artifacts/analyzer
          flutter analyze --no-fatal-infos --no-fatal-warnings > artifacts/analyzer/report.txt 2>&1
          analyze_status=$?
          cat artifacts/analyzer/report.txt
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('artifacts/analyzer/report.txt').read_text().splitlines()
          findings = [line for line in lines if 'error •' in line.lower()]
          if not findings:
              findings = lines[-20:]
          for line in findings[:30]:
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{safe}')
          PY
          exit "$analyze_status"

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flix-analyzer-report
          path: artifacts/analyzer/report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Run tests
        run: flutter test

      - name: Build one universal release APK
        run: flutter build apk --release

      - name: Verify supported ABIs are packaged
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'Missing universal APK: {apk}')
          with zipfile.ZipFile(apk) as archive:
              packaged = {
                  item.split('/')[1]
                  for item in archive.namelist()
                  if item.startswith('lib/') and item.count('/') >= 2
              }
          expected = {'armeabi-v7a', 'arm64-v8a', 'x86_64'}
          missing = expected - packaged
          if missing:
              raise SystemExit(f'Universal APK missing ABIs: {sorted(missing)}; found {sorted(packaged)}')
          print(f'Universal APK contains: {", ".join(sorted(expected))}')
          print(f'APK size: {apk.stat().st_size:,} bytes')
          PY

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flix-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish universal GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Flix Universal Release v1.0.${{ github.run_number }}"
          body: |
            ### Flix Android
            - One universal installable APK, verified to contain ARMv7, ARM64, and x86_64 native libraries.
            - Supabase-backed TMDB catalogue proxy and verified short-film Clips feed.
            - New & Hot remains available from the bottom navigation.
            - CI-signed APK; use a managed release keystore before store distribution.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  emulator-smoke-test:
    name: Install, launch, and capture Android diagnostics
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Download universal APK
        uses: actions/download-artifact@v4
        with:
          name: flix-universal-apk
          path: artifacts/apk

      - name: Prepare emulator diagnostics
        run: mkdir -p artifacts/emulator artifacts/screenshots

      - name: Install, launch, and capture on Android emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p artifacts/emulator artifacts/screenshots
            adb devices -l | tee artifacts/emulator/adb-devices.txt
            adb shell getprop ro.build.version.release > artifacts/emulator/android-version.txt
            adb logcat -c
            adb logcat -v threadtime > artifacts/emulator/logcat.txt 2>&1 &
            logcat_pid=$!
            cleanup() {
              status=$?
              kill "$logcat_pid" 2>/dev/null || true
              wait "$logcat_pid" 2>/dev/null || true
              adb shell dumpsys activity activities > artifacts/emulator/activities.txt 2>&1 || true
              adb shell dumpsys package "$FLIX_PACKAGE" > artifacts/emulator/package.txt 2>&1 || true
              exit "$status"
            }
            trap cleanup EXIT

            echo 'Installing universal APK'
            adb install -r artifacts/apk/app-release.apk
            adb shell am force-stop "$FLIX_PACKAGE" || true
            adb shell am start -W -n "$FLIX_PACKAGE/.MainActivity" | tee artifacts/emulator/launch.txt
            sleep 4

            # Three default profiles wrap into rows on the Pixel 5. This point
            # falls inside the first tile at common emulator screen sizes.
            size=$(adb shell wm size | sed -n 's/.*Physical size: //p' | tr -d '\r')
            if [[ "$size" != *x* ]]; then
              echo "Could not read emulator screen size: $size"
              exit 1
            fi
            width=${size%x*}
            height=${size#*x}
            adb shell input tap "$((width * 28 / 100))" "$((height * 46 / 100))"
            sleep 15

            if ! adb shell pidof "$FLIX_PACKAGE" > artifacts/emulator/app-pid.txt; then
              echo 'Flix process exited after profile selection; saving recent crash buffer.'
              adb logcat -b crash -d -v time > artifacts/emulator/crash-buffer.txt || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -q "$FLIX_PACKAGE/.MainActivity"
            adb exec-out screencap -p > artifacts/screenshots/flix-android-emulator.png
            test -s artifacts/screenshots/flix-android-emulator.png

            # Verify Clips can be selected without killing the app, then capture
            # it separately from the Home screenshot used in the README.
            adb shell input tap "$((width * 30 / 100))" "$((height * 93 / 100))"
            sleep 4
            adb shell pidof "$FLIX_PACKAGE" > artifacts/emulator/app-pid.txt
            adb exec-out screencap -p > artifacts/screenshots/flix-clips-emulator.png
            test -s artifacts/screenshots/flix-clips-emulator.png
            adb shell input tap "$((width * 10 / 100))" "$((height * 93 / 100))"
            sleep 2
            adb shell pidof "$FLIX_PACKAGE" >/dev/null
            adb logcat -b crash -d -v time > artifacts/emulator/crash-buffer.txt
            if grep -E 'FATAL EXCEPTION|Fatal signal' artifacts/emulator/crash-buffer.txt; then
              echo 'Android crash buffer contains a fatal exception.'
              exit 1
            fi

      - name: Upload Home and Clips screenshots
        uses: actions/upload-artifact@v4
        with:
          name: flix-readme-screenshot
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator logs and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flix-emulator-diagnostics
          path: artifacts/emulator/**
          if-no-files-found: warn
          retention-days: 30
