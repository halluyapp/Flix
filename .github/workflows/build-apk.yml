name: Build Flix Universal Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Run test suite
        run: |
          set +e
          flutter test --reporter json > /tmp/flutter-test-output.log 2>&1
          rc=$?
          echo "exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::flutter test exited $rc — failure lines below"
            ids=$(grep -oE '"testID":[0-9]+,"result":"(error|failure|exception)"' /tmp/flutter-test-output.log | grep -oE '[0-9]+' | tr '\n' '|' | sed 's/|$//')
            echo "::error::failing test ids: $ids"
            grep -E "expected|thrown|Failed to|Bad state|source|compil" /tmp/flutter-test-output.log | grep -v "result\":\"success" | tail -80 | python3 -c "import sys; [print('::error::' + l.rstrip()[:230].replace('%','%25').replace(chr(10),' ')) for l in sys.stdin]"
            exit 1
          fi

      - name: Build one universal release APK
        run: flutter build apk --release --build-name="1.0.${{ github.run_number }}" --build-number="${{ github.run_number }}"

      - name: Verify supported ABIs are packaged
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'Missing universal APK: {apk}')
          with zipfile.ZipFile(apk) as archive:
              packaged = {
                  item.split('/')[1]
                  for item in archive.namelist()
                  if item.startswith('lib/') and item.count('/') >= 2
              }
          expected = {'armeabi-v7a', 'arm64-v8a', 'x86_64'}
          missing = expected - packaged
          if missing:
              raise SystemExit(f'Universal APK missing ABIs: {sorted(missing)}; found {sorted(packaged)}')
          print(f'Universal APK contains: {", ".join(sorted(expected))}')
          print(f'APK size: {apk.stat().st_size:,} bytes')
          PY

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flix-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish universal GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Flix Universal Release v1.0.${{ github.run_number }}"
          body: |
            ### Flix Android
            - One universal installable APK, verified to contain ARMv7, ARM64, and x86_64 native libraries.
            - Provider playback with local loading visuals and a full player HUD.
            - In-app offline library with verified MP4 and paired subtitle files.
            - Tuned for low-memory phones: card-sized image decoding, capped bitmap
              cache and a sustainable default playback quality.
            - APK versionCode increments with each GitHub Actions run so Android can install it as an update.
            - CI build; configure a managed release keystore before store distribution.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
