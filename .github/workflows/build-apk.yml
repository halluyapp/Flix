name: Build Flix Universal Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLIX_PACKAGE: com.halluyapp.flix

jobs:
  build:
    name: Analyze, test, and build universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build one universal release APK
        run: flutter build apk --release

      - name: Verify supported ABIs are packaged
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'Missing universal APK: {apk}')
          with zipfile.ZipFile(apk) as archive:
              packaged = {
                  item.split('/')[1]
                  for item in archive.namelist()
                  if item.startswith('lib/') and item.count('/') >= 2
              }
          expected = {'armeabi-v7a', 'arm64-v8a', 'x86_64'}
          missing = expected - packaged
          if missing:
              raise SystemExit(f'Universal APK missing ABIs: {sorted(missing)}; found {sorted(packaged)}')
          print(f'Universal APK contains: {", ".join(sorted(expected))}')
          print(f'APK size: {apk.stat().st_size:,} bytes')
          PY

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flix-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish universal GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Flix Universal Release v1.0.${{ github.run_number }}"
          body: |
            ### Flix Android
            - One universal installable APK, verified to contain ARMv7, ARM64, and x86_64 native libraries.
            - Supabase-backed TMDB catalogue proxy and verified short-film Clips feed.
            - New & Hot remains available from the bottom navigation.
            - CI-signed APK; use a managed release keystore before store distribution.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  emulator-smoke-test:
    name: Install and capture a real Android screenshot
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download universal APK
        uses: actions/download-artifact@v4
        with:
          name: flix-universal-apk
          path: artifacts/apk

      - name: Install, launch, and capture on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r artifacts/apk/app-release.apk
            adb shell am force-stop "$FLIX_PACKAGE" || true
            adb shell am start -n "$FLIX_PACKAGE/.MainActivity"
            sleep 6

            # The app opens its profile chooser after the animated Flix splash.
            # Select the first default viewer and allow the real Home feed to render.
            size=$(adb shell wm size | sed -n 's/.*Physical size: //p' | tr -d '\r')
            width=${size%x*}
            height=${size#*x}
            adb shell input tap "$((width * 34 / 100))" "$((height * 46 / 100))"
            sleep 18

            adb shell pidof "$FLIX_PACKAGE" >/dev/null
            adb shell dumpsys activity activities | grep -q "$FLIX_PACKAGE/.MainActivity"

            # Visit Clips once, then return Home to smoke-test navigation too.
            adb shell input tap "$((width * 30 / 100))" "$((height * 96 / 100))"
            sleep 3
            adb shell dumpsys activity activities | grep -q "$FLIX_PACKAGE/.MainActivity"
            adb shell input tap "$((width * 10 / 100))" "$((height * 96 / 100))"
            sleep 3

            mkdir -p artifacts/screenshots
            adb exec-out screencap -p > artifacts/screenshots/flix-android-emulator.png
            test -s artifacts/screenshots/flix-android-emulator.png

      - name: Upload verified app screenshot
        uses: actions/upload-artifact@v4
        with:
          name: flix-readme-screenshot
          path: artifacts/screenshots/flix-android-emulator.png
          if-no-files-found: error
          retention-days: 30
