name: flix
description: "Flix — Cinema-grade Netflix Clone mobile app powered by TMDB and Zarhosting streaming."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  crypto: ^3.0.3
  share_plus: ^10.1.0
  wakelock_plus: ^1.2.8
  package_info_plus: ^8.3.1
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
